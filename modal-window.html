<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Window</title>
    <script>
        //alert("Hello!")
    </script>
    <style>
        .overlay{
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(127, 127, 127, 0.9);
            opacity: .80;
            z-index: 200;

        }

        .modalWindow{
            text-align: center;
            background-color: white;
            width: 400px;
            padding: 5px;
            border: 3px solid black;
            z-index: 201;
            overflow: hidden;
        }

        .titleBar{
            display: flex;
            align-items: center;
        }

        .title{
            flex: 1;
        }

        .modalContent{
            padding: 10px;
            height: 100%;
        }

        .closeButton{
            height: 44px;
            width: 44px;
            font-weight: bold;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        

        

    </style>
</head>
<body>
    <h1>hello world</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Facere atque explicabo laborum ipsum incidunt! Provident iste, magni ducimus doloribus incidunt minus impedit? Quam dolores laboriosam rem quis sed dicta doloribus.</p>
    <button id="btn">click me</button>

    <div class="overlay">
        <div class="modalWindow">
            <div class="titleBar">
                <h2 class="title">Title goes here</h2>
                <span class="closeButton" onClick={onClose}>X</span>
            </div>
            <div class="modalContent">
                Content goes here
            </div>
        </div>
    </div>

</body>
</html>
